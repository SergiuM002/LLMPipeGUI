[tool.briefcase]
project_name = "LLMPipeGUI"
bundle = "com.SergiuM002"
version = "1.0.0"
url = "https://github.com/SergiuM002/LLMPipeGUI"
license = "GPL-3.0-only"
license-files = ["LICENSE"]

[tool.briefcase.app.llmpipegui]
formal_name = "LLMPipeGUI"
description = "A graphical user interface for using DNA language models using customtkinter."
long_description = "A user-friendly graphical user interface for using DNA language models using customtkinter. Meant to make the usage of DNA language models easier and more intuitive for people that are less technical."
icon = "icons/llmpipegui"
sources = [
    "src/llmpipegui"
]

requires = [
    "bcrypt==5.0.0",
    "cffi==2.1.0",
    "cryptography==49.0.0",
    "CTkMessagebox==2.7",
    "customtkinter==6.0.0",
    "darkdetect==0.8.0",
    "invoke==3.0.3",
    "packaging==26.2",
    "paramiko==5.0.0",
    "pillow==12.3.0",
    "platformdirs>=4.0.0",
    "pycparser==3.0",
    "PyNaCl==1.6.2",
    "screeninfo==0.8.1"
]

[tool.briefcase.app.llmpipegui.macOS]
universal_build = false